<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Check-in online — Greta's House</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%23c2185b'/%3E%3Ctext x='12' y='17' font-size='15' text-anchor='middle'%3E%F0%9F%8F%A1%3C/text%3E%3C/svg%3E">
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:#faf6f4; color:#1a1a1a; }
  .top { background:#1e88e5; color:#fff; padding:26px 20px 22px; text-align:center; }
  .top h1 { margin:0; font-size:24px; font-weight:400; font-family:Georgia,'Times New Roman',serif; font-style:italic; }
  .top .sub { font-size:13px; opacity:.9; margin-top:4px; }
  .wrap { max-width:560px; margin:0 auto; padding:18px 16px 60px; }
  .card { background:#fff; border:1px solid #eee0dd; border-radius:14px; padding:18px 20px; margin-bottom:16px; box-shadow:0 1px 3px rgba(0,0,0,.04); }
  .card h2 { font-size:15px; margin:0 0 12px; color:#8e1046; }
  .rowinfo { display:flex; justify-content:space-between; font-size:14px; padding:6px 0; border-bottom:1px solid #f3ecea; }
  .rowinfo:last-child { border-bottom:none; }
  .rowinfo span:first-child { color:#8a7a77; }
  .rowinfo span:last-child { font-weight:700; }
  .guestcard { border:1.5px solid #eee0dd; border-radius:12px; padding:16px; margin-bottom:14px; }
  .guestcard h3 { font-size:14px; margin:0 0 12px; color:#1e88e5; }
  .field { margin-bottom:11px; }
  .field label { display:block; font-size:11.5px; font-weight:700; color:#6b5b58; margin-bottom:4px; text-transform:uppercase; letter-spacing:.3px; }
  .field input, .field select { width:100%; padding:10px 11px; border:1px solid #ddd0cd; border-radius:8px; font-size:14px; background:#fff; }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .btn { display:block; width:100%; padding:14px; border-radius:10px; border:none; font-size:15px; font-weight:700; cursor:pointer; }
  .btn-primary { background:#2c3e50; color:#fff; }
  .btn-primary:disabled { opacity:.5; }
  .msg { text-align:center; padding:60px 20px; color:#8a7a77; font-size:14px; }
  .msg.err { color:#b91c1c; }
  .ok-box { text-align:center; padding:50px 20px; }
  .ok-box .tick { font-size:52px; }
  .ok-box h2 { color:#166534; margin:10px 0 6px; }
  .privacy { font-size:11px; color:#9a8b88; margin-top:14px; line-height:1.5; }
</style>
</head>
<body>

<div class="top">
  <h1>🏡 Greta's House</h1>
  <div class="sub">Check-in online</div>
</div>

<div class="wrap" id="content"><div class="msg">Caricamento…</div></div>

<script>
const SUPABASE_URL = 'https://xhacoxddmcjwvwwygdsa.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhoYWNveGRkbWNqd3Z3d3lnZHNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0NjM3ODUsImV4cCI6MjEwMjAzOTc4NX0.G7dbZAyG9hinOU-h3WmsZGeCNd8AfwXY4eN7doSL5qk';
const FUNZIONE_URL = SUPABASE_URL + '/functions/v1/checkin-online';

function paramToken() {
  const p = new URLSearchParams(window.location.search);
  return p.get('token') || '';
}

function fmtData(iso) {
  if (!iso) return '—';
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('it-IT', { weekday:'short', day:'2-digit', month:'2-digit', year:'numeric' });
}

let prenotazione = null;
let token = '';

async function carica() {
  token = paramToken();
  const el = document.getElementById('content');
  if (!token) {
    el.innerHTML = '<div class="msg err">Link non valido — manca il codice di accesso.</div>';
    return;
  }
  try {
    const res = await fetch(FUNZIONE_URL + '?token=' + encodeURIComponent(token), {
      headers: { 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY, 'apikey': SUPABASE_ANON_KEY }
    });
    const data = await res.json();
    if (!data.ok) {
      el.innerHTML = '<div class="msg err">' + (data.errore || 'Prenotazione non trovata.') + '</div>';
      return;
    }
    prenotazione = data.booking;
    renderForm(data.propertyName, data.booking);
  } catch (err) {
    el.innerHTML = '<div class="msg err">Errore di connessione — riprova tra poco.</div>';
  }
}

function renderForm(propertyName, b) {
  const el = document.getElementById('content');
  const persone = (b.adults || 1) + (b.children || 0);
  const componentiEsistenti = b.componenti || [];

  if (b.status === 'check-in' && componentiEsistenti.length >= persone) {
    el.innerHTML =
      '<div class="card"><div class="ok-box">' +
        '<div class="tick">✅</div>' +
        '<h2>Check-in già completato</h2>' +
        '<p style="color:#8a7a77;font-size:13.5px">I tuoi dati sono già stati ricevuti. Ci vediamo presto!</p>' +
      '</div></div>';
    return;
  }

  let guestFields = '';
  for (let i = 0; i < persone; i++) {
    const c = componentiEsistenti[i] || {};
    guestFields += '<div class="guestcard">' +
      '<h3>👤 Ospite ' + (i+1) + (i===0 ? ' (intestatario)' : '') + '</h3>' +
      '<div class="row2">' +
        '<div class="field"><label>Cognome</label><input type="text" id="g-cognome-'+i+'" value="'+(c.cognome||'')+'"></div>' +
        '<div class="field"><label>Nome</label><input type="text" id="g-nome-'+i+'" value="'+(c.nome||'')+'"></div>' +
      '</div>' +
      '<div class="row2">' +
        '<div class="field"><label>Sesso</label><select id="g-sesso-'+i+'"><option value="M" '+(c.sesso!=='F'?'selected':'')+'>M</option><option value="F" '+(c.sesso==='F'?'selected':'')+'>F</option></select></div>' +
        '<div class="field"><label>Data di nascita</label><input type="date" id="g-nascita-'+i+'" value="'+(c.dataNascita||'')+'"></div>' +
      '</div>' +
      '<div class="field"><label>Cittadinanza</label><input type="text" id="g-cittadinanza-'+i+'" value="'+(c.cittadinanza||'Italia')+'"></div>' +
      '<div class="row2">' +
        '<div class="field"><label>Tipo documento</label><select id="g-tipodoc-'+i+'">' +
          '<option value="IDELE" '+(c.tipoDoc==='IDELE'?'selected':'')+'>Carta d\'identità</option>' +
          '<option value="PASOR" '+(c.tipoDoc==='PASOR'?'selected':'')+'>Passaporto</option>' +
          '<option value="PATEN" '+(c.tipoDoc==='PATEN'?'selected':'')+'>Patente</option>' +
        '</select></div>' +
        '<div class="field"><label>N. documento</label><input type="text" id="g-numdoc-'+i+'" value="'+(c.numDoc||'')+'"></div>' +
      '</div>' +
    '</div>';
  }

  el.innerHTML =
    '<div class="card">' +
      '<h2>Il tuo soggiorno</h2>' +
      '<div class="rowinfo"><span>Struttura</span><span>' + (propertyName||'Greta\'s House') + '</span></div>' +
      '<div class="rowinfo"><span>Unità</span><span>' + (b.roomName||'') + '</span></div>' +
      '<div class="rowinfo"><span>Check-in</span><span>' + fmtData(b.checkin) + '</span></div>' +
      '<div class="rowinfo"><span>Check-out</span><span>' + fmtData(b.checkout) + '</span></div>' +
      '<div class="rowinfo"><span>Ospiti</span><span>' + persone + '</span></div>' +
    '</div>' +
    '<div class="card">' +
      '<h2>Dati degli ospiti</h2>' +
      '<p style="font-size:12.5px;color:#8a7a77;margin-top:-6px">Compila i dati di ogni persona che soggiornerà — sono richiesti dalla legge per la registrazione degli ospiti.</p>' +
      guestFields +
      '<button class="btn btn-primary" id="btn-invia" onclick="inviaCheckin()">✅ Invia i miei dati</button>' +
      '<div class="privacy">I dati inseriti sono trattati esclusivamente per gli obblighi di registrazione degli ospiti e comunicati alle autorità competenti come previsto dalla normativa vigente.</div>' +
    '</div>';
}

async function inviaCheckin() {
  const persone = (prenotazione.adults || 1) + (prenotazione.children || 0);
  const componenti = [];
  for (let i = 0; i < persone; i++) {
    const cognome = (document.getElementById('g-cognome-'+i)||{value:''}).value.trim();
    const nome = (document.getElementById('g-nome-'+i)||{value:''}).value.trim();
    if (!cognome || !nome) {
      alert('Compila almeno cognome e nome per ogni ospite (ospite ' + (i+1) + ' mancante).');
      return;
    }
    componenti.push({
      cognome: cognome,
      nome: nome,
      sesso: (document.getElementById('g-sesso-'+i)||{value:'M'}).value,
      dataNascita: (document.getElementById('g-nascita-'+i)||{value:''}).value,
      cittadinanza: (document.getElementById('g-cittadinanza-'+i)||{value:''}).value.trim(),
      tipoDoc: (document.getElementById('g-tipodoc-'+i)||{value:''}).value,
      numDoc: (document.getElementById('g-numdoc-'+i)||{value:''}).value.trim(),
    });
  }

  const btn = document.getElementById('btn-invia');
  btn.disabled = true;
  btn.textContent = 'Invio in corso…';

  try {
    const res = await fetch(FUNZIONE_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY, 'apikey': SUPABASE_ANON_KEY },
      body: JSON.stringify({ token: token, componenti: componenti })
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.errore || 'Invio non riuscito');
    document.getElementById('content').innerHTML =
      '<div class="card"><div class="ok-box">' +
        '<div class="tick">✅</div>' +
        '<h2>Check-in completato!</h2>' +
        '<p style="color:#8a7a77;font-size:13.5px">Grazie, i tuoi dati sono stati ricevuti correttamente.<br>Ti aspettiamo a Greta\'s House!</p>' +
      '</div></div>';
  } catch (err) {
    btn.disabled = false;
    btn.textContent = '✅ Invia i miei dati';
    alert('Invio non riuscito: ' + (err.message || 'errore sconosciuto') + '\nRiprova tra poco.');
  }
}

carica();
</script>
</body>
</html>
