<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Rooming list</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--text:#1d2330;--muted:#6b7280;--line:#e3e6ea;--accent:#1a73e8;--ok:#1a7a3c;--bad:#b5482f;--warn:#a16207}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
header{background:var(--accent);color:#fff;padding:22px 16px 26px}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
header .wrap{padding:0}
.brand{display:flex;align-items:center;gap:12px}
.brand img{width:48px;height:48px;object-fit:contain;background:#fff;border-radius:10px;padding:4px}
h1{font-size:22px;margin:0}
.sub{opacity:.9;font-size:14px;margin-top:4px}
.lang{float:right;display:flex;gap:4px}
.lang button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:6px;padding:5px 9px;font-weight:700;cursor:pointer}
.lang button.on{background:#fff;color:var(--accent)}
main{margin-top:-14px;padding-bottom:110px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.intro{font-size:14px;color:var(--muted)}
.room-h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline;margin-bottom:6px}
.room-h h2{font-size:17px;margin:0}
.room-h span{font-size:13px;color:var(--muted)}
.person{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.person-h{font-weight:700;font-size:14px;margin-bottom:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tag{font-size:11px;font-weight:700;border-radius:20px;padding:2px 8px;background:#eef2ff;color:var(--accent)}
.tag.ok{background:#e7f5ec;color:var(--ok)}
.tag.no{background:#fdf0ec;color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:3px}
input,select{width:100%;padding:9px 10px;border:1px solid #cfd4da;border-radius:8px;font:inherit;font-size:15px;background:#fff;color:var(--text)}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.miss input,.miss select{border-color:var(--bad);background:#fff8f6}
.doc{background:#f8f9fb;border-radius:8px;padding:10px;margin-top:10px}
.doc b{font-size:12px;color:var(--muted);display:block;margin-bottom:6px}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 16px;box-shadow:0 -4px 16px rgba(0,0,0,.06)}
.bar .wrap{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:0}
.bar .stat{font-size:13px;color:var(--muted)}
.btn{background:var(--accent);color:#fff;border:0;border-radius:9px;padding:12px 20px;font:inherit;font-weight:700;cursor:pointer}
.btn:disabled{opacity:.6;cursor:default}
.msg{padding:12px 14px;border-radius:10px;margin-bottom:14px;font-size:14px}
.msg.ok{background:#e7f5ec;color:var(--ok)}
.msg.err{background:#fdf0ec;color:var(--bad)}
.center{text-align:center;padding:60px 16px;color:var(--muted)}
.privacy{font-size:12px;color:var(--muted)}
</style>
</head>

  document.querySelectorAll('.person').forEach(function(el){
    var ri = +el.dataset.r, pi = +el.dataset.p, c = DATA.camere[ri];
    if (!RISP[c.bookingId]) RISP[c.bookingId] = [];
    var p = Object.assign({}, RISP[c.bookingId][pi]||{});
    el.querySelectorAll('[data-k]').forEach(function(f){
      var k = f.dataset.k, v = f.value;
      if (k==='natoItalia') { p.natoItalia = v !== '0'; return; }
      if (['cognome','nome','luogoNascita','provNascita','residenza','provResidenza','numDoc','luogoDoc'].indexOf(k)>=0) v = v.toUpperCase();
      p[k] = v.trim();
    });
    if (p.natoItalia === false) { p.luogoNascita=''; p.provNascita=''; }
    if ((p.statoResidenza||'').toLowerCase()!=='italia') { p.residenza=''; p.provResidenza=''; }
    RISP[c.bookingId][pi] = p;
  });
}
function conta(){
  var tot=0, ok=0;
  (DATA.camere||[]).forEach(function(c, ri){ for (var pi=0; pi<c.persone; pi++){ tot++; if (completo((RISP[c.bookingId]||[])[pi]||{}, isLeader(ri,pi))) ok++; } });
  return {tot:tot, ok:ok};
}
function aggiornaStat(){ var c=conta(); document.getElementById('stat').textContent = c.ok+' / '+c.tot+' '+t('stat'); }
function evidenzia(){
  document.querySelectorAll('.person').forEach(function(el){
    var ri=+el.dataset.r, pi=+el.dataset.p, c=DATA.camere[ri], p=(RISP[c.bookingId]||[])[pi]||{}, L=isLeader(ri,pi);
    var req = campiObbligatori(p, L);
    el.querySelectorAll('[data-f]').forEach(function(w){ w.classList.toggle('miss', req.indexOf(w.dataset.f)>=0 && !String(p[w.dataset.f]||'').trim()); });
    var st = document.getElementById('st_'+ri+'_'+pi); var ok = completo(p,L);
    if (st) { st.className = 'tag '+(ok?'ok':'no'); st.textContent = ok?t('complete'):t('incomplete'); }
  });
}
document.addEventListener('input', function(e){
  if (!e.target.dataset || !e.target.dataset.k) return;
  var k = e.target.dataset.k;
  if (k==='luogoNascita' || k==='residenza') {
    var pv = COMUNI_PROV[e.target.value.toUpperCase().trim()];
    if (pv) { var box = e.target.closest('.person'); var tgt = box.querySelector('[data-k="'+(k==='luogoNascita'?'provNascita':'provResidenza')+'"]'); if (tgt && !tgt.value) tgt.value = pv; }
  }
  leggi(); aggiornaStat();
});
document.addEventListener('change', function(e){
  if (!e.target.dataset) return;
  var k = e.target.dataset.k;
  if (k==='natoItalia' || k==='statoResidenza' || k==='cittadinanza') {
    leggi();
    if (k==='cittadinanza') { // propone lo Stato di residenza uguale alla cittadinanza, se ancora vuoto
      var box = e.target.closest('.person'), c = DATA.camere[+box.dataset.r], p = RISP[c.bookingId][+box.dataset.p];
      if (!p.statoResidenza) p.statoResidenza = p.cittadinanza;
      if (p.cittadinanza && p.cittadinanza.toLowerCase()!=='italia' && !p.luogoNascita) p.natoItalia = false; // straniero: di norma nato all'estero (si può cambiare)
    }
    var y = window.scrollY; render(); window.scrollTo(0,y); if (TENTATO) evidenzia();
  }
});
document.querySelectorAll('.lang button').forEach(function(b){ b.onclick = function(){ if (DATA) leggi(); lang = b.dataset.l; render(); if (TENTATO) evidenzia(); }; });
document.getElementById('salva').onclick = function(){
  leggi(); TENTATO = true; evidenzia();
  var c = conta(), btn = this; btn.disabled = true; btn.textContent = t('saving');
  rpc('rl_salva', {p_token: token, p_risposte: RISP, p_compilati: c.ok, p_totali: c.tot}).then(function(r){
    if (!r || r.ok === false) throw new Error('save');
    document.getElementById('msg').innerHTML = '<div class="msg ok">'+esc(c.ok>=c.tot ? t('saved') : t('savedPart'))+'</div>';
    window.scrollTo({top:0, behavior:'smooth'});
    if (CFG.notifica && CFG.emailStruttura) {
      fetch(CFG.url.replace(/\/$/,'')+'/functions/v1/invio-ricevuta', {method:'POST', headers:{'Content-Type':'application/json','apikey':CFG.key,'Authorization':'Bearer '+CFG.key},
        body: JSON.stringify({to: CFG.emailStruttura, toName: DATA.struttura||'', subject: 'Rooming list aggiornata — '+(DATA.titolo||''),
          message: 'La rooming list del gruppo "'+(DATA.titolo||'')+'" è stata aggiornata dal capogruppo: '+c.ok+' ospiti completi su '+c.tot+'.\n\nApri DeskFlow → Gruppi & Eventi → Rooming list online per importarla.'})}).catch(function(){});
    }
  }).catch(function(){
    document.getElementById('msg').innerHTML = '<div class="msg err">'+esc(t('saveErr'))+'</div>';
    window.scrollTo({top:0, behavior:'smooth'});
  }).then(function(){ btn.disabled = false; btn.textContent = t('save'); });
};

(function avvio(){
  var app = document.getElementById('app');
  app.innerHTML = '<div class="card center">'+esc(t('loading'))+'</div>';
  if (!token) { app.innerHTML = '<div class="card center">'+esc(t('invalid'))+'</div>'; return; }
  rpc('rl_get', {p_token: token}).then(function(d){
    if (!d || !d.camere) { app.innerHTML = '<div class="card center">'+esc(t('invalid'))+'</div>'; return; }
    DATA = d; RISP = d.risposte || {};
    render();
  }).catch(function(){ app.innerHTML = '<div class="card center">'+esc(t('neterr'))+'</div>'; });
})();
</script>
</body>
</html>
